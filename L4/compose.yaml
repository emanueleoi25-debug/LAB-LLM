name: assistente-laboratorio

services:
  assistente:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      # LM Studio resta sull'host: dal container si raggiunge tramite host.docker.internal.
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
      # Servizio giorni e scadenze: raggiunto per nome di servizio sulla rete di Compose.
      GIORNI_BASE_URL: http://giorni:8000
      # Servizio catalogo: raggiunto per nome di servizio sulla rete di Compose.
      CATALOGO_BASE_URL: http://catalogo:8001
      # Ora dei log nel fuso di Roma (senza, i timestamp sono in UTC). L'orologio non dipende
      # da TZ: usa DEFAULT_TIMEZONE.
      TZ: Europe/Rome
      # Archivio delle note (server MCP avviato dall'agente come sottoprocesso): sul volume `note`.
      NOTE_DB_PATH: /app/dati/note.db
    volumes:
      - note:/app/dati
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - giorni
      - catalogo
    stdin_open: true
    tty: true

  giorni:
    build:
      context: .
      target: app
    command: ["python", "-m", "uvicorn", "servizio_giorni.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      # Pubblicata solo su localhost: il servizio non è esposto alla rete locale.
      - "127.0.0.1:8000:8000"

  catalogo:
    build:
      context: .
      target: app
    command: ["python", "-m", "uvicorn", "servizio_catalogo.app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      # Pubblicata solo su localhost: il servizio non è esposto alla rete locale.
      - "127.0.0.1:8001:8001"

  test:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  # Note persistenti tra un avvio e l'altro; `docker compose down -v` le cancella.
  note:
